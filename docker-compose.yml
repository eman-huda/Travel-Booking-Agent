services:
  api:
    build: .
    image: travel-agent-testbed:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/var/runs.db
      LOG_DIR: /app/var/logs
    ports:
      - "8000:8000"
    volumes:
      - ./var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build: .
    image: travel-agent-testbed:latest
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/var/runs.db
      LOG_DIR: /app/var/logs
    ports:
      - "8501:8501"
    volumes:
      - ./var:/app/var
    depends_on:
      api:
        condition: service_healthy
